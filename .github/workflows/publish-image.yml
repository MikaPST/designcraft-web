name: Build and publish DesignCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official DesignCraft release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published DesignCraft release"
        required: false
        default: false
        type: boolean

  schedule:
    # Check official upstream releases every day at 03:17 UTC.
    - cron: "17 3 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"
      - "docker-compose.yml"
      - "README.md"

permissions:
  contents: write
  packages: write

concurrency:
  group: designcraft-web-publish
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # --------------------------------------------------
      # 01. Checkout the version-controlled packaging repo
      # --------------------------------------------------
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          path: packaging

      # --------------------------------------------------
      # 02. Validate all independently maintained files
      # --------------------------------------------------
      - name: Validate packaging files
        shell: bash
        run: |
          set -euo pipefail
          for f in Dockerfile nginx.conf .dockerignore docker-compose.yml README.md; do
            test -s "packaging/$f" || { echo "::error::Missing packaging/$f"; exit 1; }
          done
          echo "Packaging files validated."

      # --------------------------------------------------
      # 03. Resolve an OFFICIAL upstream GitHub Release
      # --------------------------------------------------
      - name: Resolve official DesignCraft release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const args = { owner: 'storytold', repo: 'designcraft' };
            const { data: r } = requested
              ? await github.rest.repos.getReleaseByTag({ ...args, tag: requested })
              : await github.rest.repos.getLatestRelease(args);
            if (!r.tag_name) throw new Error('No official upstream release tag found');
            core.setOutput('tag', r.tag_name);
            core.setOutput('name', r.name || `DesignCraft ${r.tag_name}`);
            core.setOutput('url', r.html_url);
            core.setOutput('prerelease', String(r.prerelease));
            core.setOutput('published_at', r.published_at || '');
            core.info(`Selected official upstream release: ${r.tag_name}`);

      # --------------------------------------------------
      # 04. Skip previously published versions, unless the
      #     operator forces a rebuild or packaging changed
      # --------------------------------------------------
      - name: Check existing MikaPST release
        id: release-check
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.UPSTREAM_TAG
              });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const force = process.env.FORCE_REBUILD === 'true' ||
                          process.env.EVENT_NAME === 'push';
            const skip = exists && !force;
            core.setOutput('skip', String(skip));
            core.info(skip ? 'Release already packaged: skipping.' : 'Packaging release.');

      # --------------------------------------------------
      # 05. Checkout the EXACT upstream version selected
      # --------------------------------------------------
      - name: Checkout official DesignCraft source
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/designcraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: upstream
          fetch-depth: 1

      # --------------------------------------------------
      # 06. Checkout shared fonts from their own main branch
      # --------------------------------------------------
      - name: Checkout official Craft fonts
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts
          fetch-depth: 1

      # --------------------------------------------------
      # 07. Validate upstream source and its license notices
      # --------------------------------------------------
      - name: Validate upstream web build layout
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for f in Cargo.toml Cargo.lock apps/designcraft-web/Trunk.toml \
                   apps/designcraft-web/index.html LICENSE-MIT LICENSE-APACHE \
                   NOTICE ASSETS.md; do
            test -s "upstream/$f" || { echo "::error::Missing upstream/$f"; exit 1; }
          done
          test -d craft-fonts/fonts
          echo "Upstream and fonts checkout validated."

      # --------------------------------------------------
      # 08. Record complete source revisions for traceability
      # --------------------------------------------------
      - name: Record upstream and font revisions
        if: steps.release-check.outputs.skip != 'true'
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "designcraft_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "designcraft_short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "craft_fonts_sha=$(git -C craft-fonts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 09. Install Rust and the WebAssembly compilation target
      # --------------------------------------------------
      - name: Install Rust and wasm32 target
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # --------------------------------------------------
      # 10. Reuse incremental Cargo dependencies across runs
      # --------------------------------------------------
      - name: Cache Rust artifacts
        if: steps.release-check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"

      # --------------------------------------------------
      # 11. Install official Trunk WebAssembly build tool
      # --------------------------------------------------
      - name: Install Trunk
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: cargo install trunk --locked

      # --------------------------------------------------
      # 12. Use wasm-bindgen-cli matching the upstream lock
      # --------------------------------------------------
      - name: Install matching wasm-bindgen CLI
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          WASM_BINDGEN_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('upstream/Cargo.lock').read_text())
          versions = {p['version'] for p in data['package'] if p['name'] == 'wasm-bindgen'}
          if not versions:
              raise SystemExit('wasm-bindgen missing from upstream/Cargo.lock')
          print(max(versions, key=lambda v: tuple(int(n) for n in v.split('-')[0].split('.'))))
          PY
          )"
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked

      # --------------------------------------------------
      # 13. Compile upstream WebAssembly site ONCE
      # --------------------------------------------------
      - name: Compile DesignCraft Web with Trunk
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        working-directory: upstream/apps/designcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CARGO_BUILD_JOBS: "2"
        run: |
          set -euo pipefail
          trunk build --release

      # --------------------------------------------------
      # 14. Validate build output and assemble Docker context
      # --------------------------------------------------
      - name: Prepare static site and versioned Docker context
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          WEB_DIST="upstream/dist/web"
          test -s "${WEB_DIST}/index.html"
          test -n "$(find "${WEB_DIST}" -type f -name '*.wasm' -print -quit)"
          test -n "$(find "${WEB_DIST}" -type f -name '*.js' -print -quit)"
          # Trunk's public_url='./' is required for prefix deployments.
          if grep -Eq '(src|href)="/[^/]' "${WEB_DIST}/index.html"; then
            echo "::error::Generated index.html uses root-absolute paths."
            exit 1
          fi
          mkdir -p docker-context/site docker-context/legal
          cp -a "${WEB_DIST}/." docker-context/site/
          cp packaging/Dockerfile packaging/nginx.conf packaging/.dockerignore docker-context/
          cp upstream/LICENSE-MIT upstream/LICENSE-APACHE upstream/NOTICE \
             upstream/ASSETS.md docker-context/legal/
          if test -d upstream/licenses; then
            cp -a upstream/licenses docker-context/legal/third-party
          fi
          # Preserve all available font OFL notices, independently of build assets.
          for license in craft-fonts/fonts/*/OFL.txt; do
            if test -f "$license"; then
              family="$(basename "$(dirname "$license")")"
              cp "$license" "docker-context/legal/OFL-${family}.txt"
            fi
          done
          test -s docker-context/site/index.html
          test -s docker-context/Dockerfile
          test -s docker-context/nginx.conf
          echo "Static site and legal notices prepared."

      # --------------------------------------------------
      # 15. Emulate ARM64 when publishing from an AMD64 runner
      # --------------------------------------------------
      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      # --------------------------------------------------
      # 16. Initialize the Docker multi-platform builder
      # --------------------------------------------------
      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # --------------------------------------------------
      # 17. Authenticate to the GitHub Container Registry
      # --------------------------------------------------
      - name: Log in to GHCR
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 18. Create latest, official version and SHA image tags
      # --------------------------------------------------
      - name: Generate Docker image metadata
        if: steps.release-check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mikapst/designcraft-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream-release.outputs.tag }}
            type=raw,value=upstream-${{ steps.source.outputs.designcraft_short }}

      # --------------------------------------------------
      # 19. Build & PUSH: Rust was compiled only once above
      # --------------------------------------------------
      - name: Build and publish multi-platform Docker image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DESIGNCRAFT_COMMIT=${{ steps.source.outputs.designcraft_sha }}
            CRAFT_FONTS_COMMIT=${{ steps.source.outputs.craft_fonts_sha }}
            DESIGNCRAFT_VERSION=${{ steps.upstream-release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --------------------------------------------------
      # 20. Only after a successful GHCR push, publish the
      #     matching MikaPST GitHub Release and its digest
      # --------------------------------------------------
      - name: Create or update matching GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.upstream-release.outputs.name }}
          UPSTREAM_URL: ${{ steps.upstream-release.outputs.url }}
          UPSTREAM_DATE: ${{ steps.upstream-release.outputs.published_at }}
          UPSTREAM_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          UPSTREAM_SHA: ${{ steps.source.outputs.designcraft_sha }}
          UPSTREAM_SHORT: ${{ steps.source.outputs.designcraft_short }}
          FONTS_SHA: ${{ steps.source.outputs.craft_fonts_sha }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.UPSTREAM_TAG;
            const image = 'ghcr.io/mikapst/designcraft-web';
            const { data: upstream } = await github.rest.repos.getReleaseByTag({
              owner: 'storytold', repo: 'designcraft', tag
            });
            const body = [
              `This release packages **${process.env.UPSTREAM_NAME}** as a self-hosted Docker image.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.UPSTREAM_SHORT}\``,
              '',
              'Supported platforms: `linux/amd64`, `linux/arm64`.',
              '',
              '## Upstream project',
              `- **Official release:** [${process.env.UPSTREAM_NAME}](${process.env.UPSTREAM_URL})`,
              `- **Upstream release tag:** \`${tag}\``,
              `- **Upstream source commit:** \`${process.env.UPSTREAM_SHA}\``,
              `- **Published upstream:** ${process.env.UPSTREAM_DATE || 'not specified'}`,
              `- **Shared fonts commit:** \`${process.env.FONTS_SHA}\` (storytold/craft-fonts, main)`,
              '',
              '## Image details',
              `- **Manifest digest:** \`${process.env.IMAGE_DIGEST || 'not reported'}\``,
              '- **Packaging:** independently maintained by MikaPST; not an official DesignCraft release.',
              '- **Build configuration:** Dockerfile, nginx.conf and .dockerignore versioned in MikaPST/designcraft-web.',
              '',
              '## Upstream release notes',
              upstream.body || 'No upstream release notes provided.'
            ].join('\n');
            let existing;
            try {
              ({ data: existing } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const args = {
              owner, repo, tag_name: tag,
              name: `DesignCraft Web ${tag}`, body,
              draft: false, prerelease: process.env.UPSTREAM_PRERELEASE === 'true'
            };
            if (existing) {
              await github.rest.repos.updateRelease({ ...args, release_id: existing.id });
            } else {
              await github.rest.repos.createRelease({ ...args, target_commitish: context.sha });
            }
