# NGINX runtime configuration, independently versioned by MikaPST/designcraft-web.
# See upstream: https://github.com/storytold/designcraft/blob/main/packaging/web/README.md
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # NGINX must not write runtime files to root-owned directories.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript text/css application/json image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;

        # Health endpoint for container checks and load balancers.
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
            return 200 "ok\n";
        }

        # HTML must be revalidated so clients see new deployments.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Trunk produces content-hashed JS / WebAssembly files.
        # Only these immutable URLs receive long-lived caching.
        location ~* "-[0-9a-f]{8,}\.(?:js|wasm)$" {
            types { text/javascript js; application/wasm wasm; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Non-hashed files should be revalidated; .wasm requires the correct MIME.
        location ~* \.wasm$ {
            types { application/wasm wasm; }
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        location ~* \.js$ {
            types { text/javascript js; }
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # No SPA fallback: fail explicitly on missing assets.
        # Prefix hosting is possible when the reverse proxy strips the prefix.
        location / { try_files $uri $uri/ =404; }
    }
}
